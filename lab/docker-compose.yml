services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact_broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact_broker"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pact-pgdata:/var/lib/postgresql/data

  pact-broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@postgres:5432/pact_broker
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_BASE_URL: ${PACT_BROKER_PUBLIC_URL:-http://192.168.1.39:9292}
      PACT_BROKER_BASIC_AUTH_USERNAME: pact
      PACT_BROKER_BASIC_AUTH_PASSWORD: pact
      PACT_BROKER_WEBHOOK_SCHEME_WHITELIST: http
      PACT_BROKER_WEBHOOK_HOST_WHITELIST: webhook-receiver,localhost
      PACT_BROKER_WEBHOOK_HTTP_METHOD_WHITELIST: POST
      PACT_BROKER_LOG_LEVEL: info

  webhook-receiver:
    build:
      context: ./webhook-receiver
    ports:
      - "7070:7070"
    environment:
      PORT: 7070
      EVENTS_DIR: /app/events
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-secret}
      PACT_URL_HOST_ALLOWLIST: ${PACT_URL_HOST_ALLOWLIST:-localhost,127.0.0.1,pact-broker,192.168.1.39,gitlab.local}
      EXPECTED_CONSUMER: the-consumer
      EXPECTED_PROVIDER: the-provider
    volumes:
      - ./webhook-events:/app/events
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:7070/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pact-pgdata:
